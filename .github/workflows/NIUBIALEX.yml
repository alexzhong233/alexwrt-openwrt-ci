name: NIUBIALEX

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 06:17 触发。
    # 不要写成整点：GitHub 在每小时 00 分负载最高，整点的定时任务经常被
    # 延迟几十分钟甚至直接丢弃，错开几分钟能明显提高准时率。
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '额外插件配置，每行一个 CONFIG_PACKAGE_*，可选。'
        required: false
        type: string
      TEST:
        description: '仅生成配置，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    name: jdcloud_re-cs-02
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 末尾的 -WIFI-YES 是必要的：WRT-CORE 用它来给固件文件名打 WIFI 标记，
      # 不写就会被识别成 none，文件名变成 ...-none-<日期>.bin
      WRT_CONFIG: IPQ60XX-NIUBIALEX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: alexWrt
      WRT_SSID: niubiAlex
      WRT_WORD: "88888888"
      WRT_IP: 192.168.88.1
      WRT_PW: 不设置，首次登录后自行设置
      # 上游用 VIKINGYFY/immortalwrt 的 owrt 分支。
      #
      # 这套上游的 NSS 走 nss-wifi-drv：它自己 boot NSS 固件，用 wifili 把无线帧
      # 直接送进 NSS 硬件，是真正生效的无线加速。实测
      #   /sys/bus/platform/devices/39000000.nss/state → ready=1 peers=5 wlan=3
      #   日志 → "bring-up survived; NSS data plane ready"
      #
      # 577090447/main 那套是 qca-nss-drv + ecm 的完整数据平面，卸载的是有线转发；
      # 它没有 wifili，WiFi 的包进 NSS 后只能走 exception 退回 CPU，所以状态页虽然
      # 有计数，无线本身并没有加速。此外它会去掉 qca-ppe-qos 和 luci-app-router-tool。
      #
      # 家里现在以 WiFi 为主，将来有线玩游戏流量也小，CPU 软转发足够，故选 owrt。
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_EXTRA_CONFIG: IPQ60XX-NIUBIALEX-OVERRIDES.txt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST || false}}
      WRT_FILES: RE-CS-02
      WRT_APPFILTER: true
