name: NIUBIALEX

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 06:17 触发。
    # 不要写成整点：GitHub 在每小时 00 分负载最高，整点的定时任务经常被
    # 延迟几十分钟甚至直接丢弃，错开几分钟能明显提高准时率。
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '额外插件配置，每行一个 CONFIG_PACKAGE_*，可选。'
        required: false
        type: string
      TEST:
        description: '仅生成配置，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    name: jdcloud_re-cs-02
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 末尾的 -WIFI-YES 是必要的：WRT-CORE 用它来给固件文件名打 WIFI 标记，
      # 不写就会被识别成 none，文件名变成 ...-none-<日期>.bin
      WRT_CONFIG: IPQ60XX-NIUBIALEX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: alexWrt
      WRT_SSID: niubiAlex
      WRT_WORD: "88888888"
      WRT_IP: 192.168.88.1
      WRT_PW: 不设置，首次登录后自行设置
      # 上游用 577090447/immortalwrt 而不是 VIKINGYFY/immortalwrt。
      # 两者同源（前者是后者的 fork），差别在于前者把整条 NSS 链路做进去了：
      # package/qca-nss 下有 qca-nss-drv / ecm / dp / clients / crypto / phy /
      # mcs / ssdk，并且写进了 qualcommax 的 DEFAULT_PACKAGES。
      # VIKINGYFY/owrt 只有 kmod-nss-wifi-drv（Wi-Fi 侧加速），没有数据平面，
      # 所以 luci-app-nss 永远显示「未加载」。
      WRT_REPO: https://github.com/577090447/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: 577090447/immortalwrt
      WRT_EXTRA_CONFIG: IPQ60XX-NIUBIALEX-OVERRIDES.txt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST || false}}
      WRT_FILES: RE-CS-02
      WRT_APPFILTER: true
