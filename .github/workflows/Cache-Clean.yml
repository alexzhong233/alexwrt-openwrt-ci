name: Cache-Clean

on:
  # 构建结束之后再清理，避免像以前那样在编译前一小时把缓存全删掉，
  # 导致每次都要重新编译 host 工具链（冷编译 4 小时 vs 热编译 1 小时）。
  #
  # 两条线都要挂：缓存池是仓库级共享的，只有 ALEXWRT 会触发清理的话，
  # 一直跑 LIBWRT 不跑 ALEXWRT 的那些天，下载缓存会一代代堆到 10 GB 上限，
  # 然后被 GitHub 的 LRU 随机淘汰 —— 连编译缓存一起踹掉，下次冷编译。
  workflow_run:
    workflows: [ALEXWRT, LIBWRT]
    types: [completed]
  # 手动清理
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    # 只有构建成功才会有新缓存写进来；失败的运行不清理，保留上一次可用的缓存。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prune Old Caches
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GH_REPO: ${{github.repository}}
        run: |
          set -euo pipefail

          # 构建内部已经由 cache-rollover 按 key 前缀收拢过一代，这里再做一层
          # 保底，防止撞上仓库 10 GB 的缓存总额限制。
          #
          # 必须按 key 分组，不能全局只留最新一条：一次构建会产生两类缓存
          #   wrt-dl-<target>-<Config hash>        下载缓存，配置一改就新写一条
          #   wrt-<source>-<branch>-<target>-<sha> 编译缓存，cache-hit 时会跳过保存
          # 两类混在一起排序的话，编译缓存永远比下载缓存旧，会被整类删掉，
          # 下一轮必然退化成冷编译（4 小时）。所以去掉末尾 hash 段后的同组
          # key 算一类，每组各自保留最近 N 条。
          #
          # 保留代数按类区分：
          #   wrt-dl-*  留 2 代。它的 key 里带 hashFiles('Config/*.txt')，改任何
          #             一个 Config 文件都会换一条 key；只留 1 代的话，改完配置
          #             再想回滚就得重新下载 3.5 GB 源码包。
          #   wrt-*     留 1 代。每次构建后 cache-rollover 已经把同前缀的旧代删
          #             干净了，这里基本是空操作，留着只为兜住 rollover 漏掉的。
          #
          # 预算：dl 2×3.5 GB + 编译缓存两条线各 1~2 GB ≈ 9 GB，贴着 10 GB 上限。
          # 真超了会被 GitHub LRU 淘汰，所以这里不要再放宽代数。
          gh cache list --repo "$GH_REPO" --limit 100 --json id,key,createdAt \
            --jq '
              [ .[] | . + {group: (.key | sub("-[^-]+$"; ""))} ]
              | group_by(.group)
              | map(
                  (if (.[0].group | startswith("wrt-dl-")) then 2 else 1 end) as $keep
                  | (sort_by(.createdAt) | reverse) as $sorted
                  | $sorted[$keep:]
                )
              | flatten
              | .[].id' |
            while read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID"
            done
