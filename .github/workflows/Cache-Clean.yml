name: Cache-Clean

on:
  # 构建结束之后再清理，避免像以前那样在编译前一小时把缓存全删掉，
  # 导致每次都要重新编译 host 工具链（冷编译 4 小时 vs 热编译 1 小时）。
  #
  # 两条线都要挂：缓存池是仓库级共享的，只有 ALEXWRT 会触发清理的话，
  # 一直跑 LIBWRT 不跑 ALEXWRT 的那些天，下载缓存会一代代堆到 10 GB 上限，
  # 然后被 GitHub 的 LRU 随机淘汰 —— 连编译缓存一起踹掉，下次冷编译。
  workflow_run:
    workflows: [ALEXWRT, LIBWRT]
    types: [completed]
  # 手动清理
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    # 只有构建成功才会有新缓存写进来；失败的运行不清理，保留上一次可用的缓存。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prune Old Caches
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GH_REPO: ${{github.repository}}
        run: |
          set -euo pipefail

          # 构建内部已经由 cache-rollover 按 key 前缀收拢过一代，这里再做一层
          # 保底，防止撞上仓库 10 GB 的缓存总额限制。
          #
          # 必须按 key 分组，不能全局只留最新一条：一次构建会产生两类缓存
          #   wrt-dl-v2-<source>-<branch>-<target>-<Config hash>  下载缓存（按线隔离）
          #   wrt-<source>-<branch>-<target>-<sha>                编译缓存
          # 两类混在一起排序的话，编译缓存永远比下载缓存旧，会被整类删掉，
          # 下一轮必然退化成冷编译（4 小时）。所以去掉末尾 hash 段后的同组
          # key 算一类，每组各自保留最近 1 条。
          #
          # 预算与旧缓存淘汰：
          #   · 旧版共享下载缓存 wrt-dl-<target>-* 已经涨到 5.42 GiB（两代就会
          #     撞穿 10 GiB 上限触发 GitHub LRU 随机淘汰），这里无条件清掉；
          #   · wrt-dl-v2-* 和 wrt-* 编译缓存各自只留 1 代（两条线合计约
          #     2×3 GiB + 2×1 GiB ≈ 8 GiB，稳稳留在 10 GiB 预算内）。
          gh cache list --repo "$GH_REPO" --limit 100 --json id,key,createdAt \
            --jq '
              [
                ( .[]
                  | select((.key | startswith("wrt-dl-")) and ((.key | startswith("wrt-dl-v2-")) | not))
                  | .id
                ),
                ( [ .[]
                    | select(((.key | startswith("wrt-dl-")) and ((.key | startswith("wrt-dl-v2-")) | not)) | not)
                    | . + {group: (.key | sub("-[^-]+$"; ""))}
                  ]
                  | group_by(.group)
                  | map((sort_by(.createdAt) | reverse) | .[1:])
                  | flatten
                  | .[].id
                )
              ]
              | unique
              | .[]' |
            while read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID"
            done
