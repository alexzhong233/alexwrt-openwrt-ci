#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
      WRT_EXTRA_CONFIG:
        required: false
        default: ''
        type: string
      WRT_FILES:
        required: false
        default: ''
        type: string
      WRT_APPFILTER:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_EXTRA_CONFIG: ${{inputs.WRT_EXTRA_CONFIG}}
  WRT_FILES: ${{inputs.WRT_FILES}}
  WRT_APPFILTER: ${{inputs.WRT_APPFILTER}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    # 调用方（ALEXWRT / LIBWRT）都写了 permissions: write-all，理论上会继承下来，
    # 但 LIBWRT 连续两次在 Release Firmware 报 403 Resource not accessible by
    # integration —— 同一个 WRT-CORE 被 ALEXWRT 调用时是成功的。显式声明一遍，
    # 排除可复用工作流里权限继承的边界情况（reusable workflow 的 job 级权限
    # 只能收窄、不能放大，所以这里写的就是实际生效的那份）。
    #   contents: write —— 建 release / 打 tag
    #   actions: write  —— 存删 Actions 缓存
    permissions:
      contents: write
      actions: write
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      # 只装需要的工具链，不再对整台机器做 full-upgrade（它会连带升级内核和
      # 整套系统库，曾让这一步卡了 20 分钟）。工具链缺的依赖 apt 装包时自己会补。
      #
      # 但 runner 的 DNS 会整体挂掉（security.ubuntu.com 解析失败），此时 apt
      # 会一路重试到 36 分钟才放弃，整次构建白跑（LIBWRT #4 就是这么挂的：
      # 15:03 开始报 Temporary failure resolving，15:39 才 E: Failed to fetch）。
      # 所以这里把 HTTP 超时压到 15 秒、重试降到 2 次，外面再套 3 轮：
      # 宁可快速失败重来，也不要在一次解析失败上耗半小时。
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          PKGS="bc bison build-essential bzip2 ca-certificates ccache clang \
          cmake cpio curl device-tree-compiler dos2unix file flex \
          g++-multilib gawk gcc-multilib genisoimage gettext git jq \
          libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
          llvm ninja-build patch perl pkgconf python3 python3-cryptography \
          python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
          unzip wget xz-utils zlib1g-dev zstd"

          OK=0
          for i in 1 2 3; do
            sudo apt-get -yqq $APT_OPTS update || true
            if sudo apt-get install -yqq --no-install-recommends $APT_OPTS $PKGS; then
              echo "apt install 第 $i 轮成功"
              OK=1
              break
            fi
            echo "::warning::apt install 第 $i 轮失败（多为 DNS 解析），30 秒后重试"
            sleep 30
          done
          if [ "$OK" != "1" ]; then
            echo "::error::apt install 连续 3 轮失败，runner 网络/DNS 异常，重跑即可"
            exit 1
          fi

          sudo apt-get -yqq purge firefox || true
          sudo apt-get -yqq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo rm -f "$GITHUB_WORKSPACE/wrt"
          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            # 固件名里的来源标识。以前取 WRT_SOURCE 的 owner（上游作者名），
            # 出来是 ...-VIKINGYFY-owrt-...，跟构建者没关系。改用本仓库的
            # owner，产物就带自己的名字了。注意这只影响命名，缓存 key 用的是
            # 下面的 WRT_CACHE_PREFIX，仍然是上游仓库+分支+机型，互不干扰。
            echo "WRT_INFO=${GITHUB_REPOSITORY_OWNER}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

          # LibWrt 那条线的上游 base-files 不带 /etc/shadow 的 root 密码，
          # 刷完就是彻底无密码：LuCI 打开直接进，SSH 用 root + 空密码。
          # 这件事必须在 release 说明里喊出来，否则刷完的人不会想到去设密码，
          # 同网段任何人都能改配置。
          # OWRT 那条线保持原样（首次登录会引导设置），这里留空。
          if echo "$WRT_CONFIG" | grep -qi "LIBWRT"; then
            echo "WRT_LOGIN_NOTE=⚠ 本版本（LibWrt 基线）root 默认没有密码：浏览器打开 http://${WRT_IP:-192.168.88.1} 直接进入，SSH 用 root + 空密码。刷完请立刻执行 passwd 或到「系统 → 管理权」设置密码，否则同网段任何人都能改你的路由器。" >> "$GITHUB_ENV"
          else
            echo "WRT_LOGIN_NOTE=" >> "$GITHUB_ENV"
          fi

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      # dl/ 是编译用的源码 tarball（这个配置大概 2~3 GB），以前每轮都从头
      # 下次下载，网络一慢这一步就是十几分钟起步。单独给它一份缓存：key 带上
      # Config 的哈希，配置不变就一直命中，配置变了才重新下一份。
      # 注意：靠 restore-keys 前缀命中的是「部分匹配」，cache-hit 仍为 false，
      # 所以每改一次 Config/*.txt 都会新写一条，靠 Cache-Clean 按时收拢。
      - name: Restore Download Cache
        id: cache-dl
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          path: ./wrt/dl
          key: wrt-dl-${{env.WRT_CACHE_TARGET}}-${{ hashFiles('Config/*.txt') }}
          restore-keys: wrt-dl-${{env.WRT_CACHE_TARGET}}-

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh
          $GITHUB_WORKSPACE/Scripts/prepare-uu-view-preload.sh
          $GITHUB_WORKSPACE/Scripts/prepare-luci-packages.sh

      - name: Install Custom Files
        if: ${{ env.WRT_FILES != '' }}
        run: |
          cd ./wrt/
          if [ -d "$GITHUB_WORKSPACE/Files/$WRT_FILES" ]; then
            mkdir -p ./files
            cp -a "$GITHUB_WORKSPACE/Files/$WRT_FILES/." ./files/
          else
            echo "Custom file bundle not found: $GITHUB_WORKSPACE/Files/$WRT_FILES" >&2
            exit 1
          fi

          # 软件源按线二选一。
          #
          # Files 里放的是 customfeeds.list.owrt 和 customfeeds.list.libwrt 两份模板，
          # 后缀不是 .list，apk 不会读。这里按 WRT_CONFIG 挑一份改名生效、另一份删掉。
          #
          # 为什么要分：OWRT 用的南京大学镜像是 immortalwrt 的验证包，
          # LibWrt 固件的 apk 密钥是它自己的，加进去只会刷 "UNTRUSTED signature"；
          # 而且两棵树内核版本不同，kmod-* 混装会直接起不来。
          REPO_DIR=./files/etc/apk/repositories.d
          if [ -d "$REPO_DIR" ]; then
            case "$WRT_CONFIG" in
              *LIBWRT*) KEEP=libwrt ;;
              *)        KEEP=owrt ;;
            esac
            for F in "$REPO_DIR"/customfeeds.list.*; do
              [ -f "$F" ] || continue
              case "$F" in
                *."$KEEP") mv -f "$F" "$REPO_DIR/customfeeds.list" ;;
                *)         rm -f "$F" ;;
              esac
            done
            echo "自定义软件源模板: 已选用 $KEEP"
            ls -1 "$REPO_DIR"
          fi

      - name: Custom Settings
        run: |
          cd ./wrt/

          # 顺序即优先级：.config 是后者覆盖前者，所以 GENERAL（全平台通用）
          # 必须排在最前面，板级文件排在它后面，才能覆盖通用项（例如本仓库
          # 把 GENERAL 里的 luci-app-homeproxy=y 在雅典娜上改成 =m）。
          # 早期是「板级 → GENERAL → OVERRIDES」三段拼接，靠第三个文件兜底；
          # 现在两边合并，只留「通用 → 板级 → 额外」两段（额外的仍留作口子）。
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/GENERAL.txt $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          fi

          if [ -n "$WRT_EXTRA_CONFIG" ]; then
            cat "$GITHUB_WORKSPACE/Config/$WRT_EXTRA_CONFIG" >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          # defconfig 的输出留一份：某个包依赖的库不存在时，OpenWrt 只打一行
          # WARNING，包本身照样进 .config，要等两小时后打包 rootfs 才会以
          # "unable to select packages" 失败。下面的 Verify 步骤会解析这份日志。
          if ! make defconfig -j$(nproc) > "$GITHUB_WORKSPACE/defconfig.log" 2>&1; then
            tail -60 "$GITHUB_WORKSPACE/defconfig.log"
            exit 1
          fi
          make clean -j$(nproc)

      # make defconfig 遇到源码缺失、依赖不满足或包已改名的 CONFIG_PACKAGE
      # 不会报错，只会把那一行静默删掉，最终产出一个"构建成功"但少插件的固件。
      # 这里把配置里要求 =y 的包和实际 .config 逐条比对。
      #
      # 分两级：Scripts/Packages.sh 自己 clone 的包一旦整行消失，说明克隆或提取
      # 失败，直接中断构建；其余（kmod、平台内核相关）只提示，因为它们在当前
      # 平台/内核配置下本来就不存在。确属正常的包可写进 Config/verify-ignore.txt。
      - name: Verify Package Selection
        run: |
          cd ./wrt/

          # 顺序要和 Custom Settings 里的 cat 顺序完全一致，否则覆盖关系算错。
          CONFIG_FILES=""
          if [[ "${WRT_CONFIG,,}" != *"test"* ]]; then
            CONFIG_FILES="$CONFIG_FILES $GITHUB_WORKSPACE/Config/GENERAL.txt"
          fi
          CONFIG_FILES="$CONFIG_FILES $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          if [ -n "$WRT_EXTRA_CONFIG" ]; then
            CONFIG_FILES="$CONFIG_FILES $GITHUB_WORKSPACE/Config/$WRT_EXTRA_CONFIG"
          fi

          # 同一包可能先后出现 =y 和 =m（板级文件最后写入并生效），
          # 按出现顺序覆盖，只保留最终为 y 的。
          REQUESTED=$(cat $CONFIG_FILES |
            grep -oE '^CONFIG_PACKAGE_[^=]+=[ym]' |
            sed 's/^CONFIG_PACKAGE_//' |
            awk -F= '{v[$1]=$2} END {for (k in v) if (v[k]=="y") print k}' | sort)
          TOTAL=$(printf '%s\n' "$REQUESTED" | grep -c . || true)

          SELF_PKGS=$(grep -oE '^UPDATE_(PACKAGE|TOPLEVEL_PACKAGE|NESTED_PACKAGE) "[^"]+"' \
            "$GITHUB_WORKSPACE/Scripts/Packages.sh" |
            sed -E 's/^[A-Z_]+ "([^"]+)"$/\1/')

          IGNORE_FILE="$GITHUB_WORKSPACE/Config/verify-ignore.txt"

          FATAL=""; WARN=""
          for PKG in $REQUESTED; do
            if grep -qxF "CONFIG_PACKAGE_$PKG=y" .config; then
              continue
            fi

            if [ -f "$IGNORE_FILE" ] && grep -qxF "$PKG" "$IGNORE_FILE"; then
              continue
            fi

            if grep -qxF "# CONFIG_PACKAGE_$PKG is not set" .config; then
              WARN="$WARN $PKG(依赖不满足)"
              continue
            fi
            if grep -qxF "CONFIG_PACKAGE_$PKG=m" .config; then
              WARN="$WARN $PKG(被降级为m)"
              continue
            fi

            # 整行都不存在 = 包源码没进树。只有自建包才判定为致命。
            OWNED=0
            for S in $SELF_PKGS; do
              case "$PKG" in
                *"$S"*) OWNED=1; break ;;
              esac
            done
            if [ "$OWNED" -eq 1 ]; then
              FATAL="$FATAL $PKG"
            else
              WARN="$WARN $PKG(平台不适用)"
            fi
          done

          if [ -n "$WARN" ]; then
            echo "::warning::以下包未按配置进入 .config（不阻断构建）："
            for ITEM in $WARN; do echo "  warn: $ITEM"; done
          fi

          if [ -n "$FATAL" ]; then
            echo "::error::以下自建包整行未出现在 .config，说明 Packages.sh 的克隆或提取没成功"
            for PKG in $FATAL; do echo "  dropped: $PKG"; done
            echo ""
            echo "排查方向："
            echo "  1. 上游仓库是否改名/删分支/变更目录结构（看 Custom Packages 步骤日志里的 ::error::）"
            echo "  2. 包名是否和 Makefile 里的 define Package 不一致"
            echo "  3. 确认属于该平台本来就没有的包，写进 Config/verify-ignore.txt 后重跑"
            exit 1
          fi

          echo "校验完成：配置中 $TOTAL 个 =y 软件包全部按预期进入 .config。"

      # 依赖缺失只有到 rootfs 打包阶段才炸（apk 在 local 仓库里找不到依赖），
      # 而那时已经编译了近两小时。defconfig 阶段其实已经打出 WARNING，这里提前
      # 把「配置里选中的包 + 它缺的依赖」判成错误。
      - name: Verify Package Dependencies
        run: |
          cd ./wrt/

          DEPLOG="$GITHUB_WORKSPACE/defconfig.log"
          IGNORE_FILE="$GITHUB_WORKSPACE/Config/verify-ignore.txt"
          if [ ! -f "$DEPLOG" ]; then
            echo "没有 defconfig.log，跳过依赖校验。"
            exit 0
          fi

          # 形如：
          # WARNING: Makefile 'package/feeds/luci/luci-app-systools/Makefile' has
          #   a dependency on 'luci-lib-iform', which is not available
          MISSING=$(grep -oE "WARNING: Makefile '[^']*' has a (build )?dependency on '[^']*', which is not available" "$DEPLOG" |
            sed -E "s#^WARNING: Makefile '([^']*)'.*dependency on '([^']*)',.*#\2|\1#" | sort -u || true)

          if [ -z "$MISSING" ]; then
            echo "依赖校验通过：defconfig 没有报缺失依赖。"
            exit 0
          fi

          FATAL=""; WARN=""
          while IFS='|' read -r DEP SRC_MK; do
            [ -z "$DEP" ] && continue
            # 告警里的 Makefile 路径 → 目录名，绝大多数情况就是包名
            SRC_DIR=$(basename "$(dirname "$SRC_MK")")

            if [ -f "$IGNORE_FILE" ] && grep -qxF "$DEP" "$IGNORE_FILE"; then
              continue
            fi

            if grep -qxF "CONFIG_PACKAGE_$SRC_DIR=y" .config; then
              FATAL="$FATAL $SRC_DIR->$DEP"
            else
              WARN="$WARN $SRC_DIR->$DEP"
            fi
          done <<< "$MISSING"

          if [ -n "$WARN" ]; then
            echo "::warning::以下未被选中的包存在缺失依赖（不影响构建）："
            for ITEM in $WARN; do echo "  warn: $ITEM"; done
          fi

          if [ -n "$FATAL" ]; then
            echo "::error::以下已选中的包依赖的库不存在，打包 rootfs 时 apk 一定会失败"
            for ITEM in $FATAL; do echo "  missing: $ITEM"; done
            echo ""
            echo "排查方向："
            echo "  1. 该依赖是否已被上游 feed 移除/改名，需要像 luci-lib-docker 一样自己 clone"
            echo "  2. 依赖是否写在 *_EXTRA_DEPENDS 里（不进编译，但会进包元数据），需要在配置里显式 CONFIG_PACKAGE_xxx=y"
            echo "  3. 确认确实不需要，把依赖名写进 Config/verify-ignore.txt 后重跑"
            exit 1
          fi

          echo "依赖校验完成：没有已选中包依赖缺失的库。"

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Download Cache
        # 同 Save Build Cache：缓存只是加速手段，超限或失败都不该影响交付。
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-dl.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@main
        with:
          path: ./wrt/dl
          key: wrt-dl-${{env.WRT_CACHE_TARGET}}-${{ hashFiles('Config/*.txt') }}

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        # 缓存超过仓库 10 GB 上限时 save 会直接报错。这一步排在打包发版之前，
        # 失败会把整个 job 判为失败，导致固件已经编译完成却发不出去。缓存是
        # 纯加速手段，失败不应该影响交付。
        continue-on-error: true
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            # =m 的包（OpenClash、订阅转换 subgen）只编译、不发布。
            # release 里只放固件，一个 apk 都不带。
            # 它们的产物编译完就在 runner 上，随 runner 一起销毁 —— 这是
            # 有意为之：改 =m 的目的是不占固件体积，不是另开一个分发渠道。
            # 这里只统计数量并打日志，用来确认它们确实编出来了（编不出来
            # 也不会让固件失败，但至少日志里看得见）。
            if [ -d ./bin/packages ]; then
              MCOUNT=$(find ./bin/packages/ -type f -name "*.apk" | wc -l)
              for MUST in luci-app-openclash luci-app-subgen ruby; do
                if ! find ./bin/packages/ -type f -name "${MUST}*.apk" | grep -q .; then
                  echo "::warning::=m 包 $MUST 没有编出来，检查它的源码是否拉取成功"
                fi
              done
              echo "::notice::=m 包编译产物 ${MCOUNT} 个（不发布，release 只发固件）"
            fi

            # 上游的 sha256sums 已在上面删掉（里面的文件名都对不上改名后的
            # 固件），这里按最终文件名重新生成一份，刷机前可以校验完整性。
            ( cd ./upload &&
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
                sort | xargs -r sha256sum > SHA256SUMS )
          fi

      # 保底：Release 那一步一旦失败（403、tag 冲突、网络抖动），1.5 小时编译
      # 出来的 400+ MB 固件会随 runner 一起消失，只能重编。这里先传一份
      # artifact，无论后面发不发得出去，run 页面上都能直接下载。
      #
      # compression-level: 0 —— 固件本身是 squashfs（xz/lzma 已压过），再压一遍
      # 只耗 CPU 不掉体积，400 MB 压一次要几分钟。
      - name: Upload Firmware Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}-${{github.run_attempt}}
          path: ./wrt/upload/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      # TEST 模式只生成配置、不编译固件，但依然照常发 Release —— 这是刻意
      # 保留的行为：只放一个 Config txt 的版本用来留档/对比配置，不要拦。
      # 不过要标记成 pre-release：① GitHub 的 Latest 徽标只给正式固件；
      # ② Auto-Clean 按 pre-release 与否分开计数，TEST 版本不会挤掉固件名额。
      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          # 必须钉死。不指定时 tag 打在「这一步执行时默认分支的最新 commit」上，
          # 而一次构建要跑一两个小时，中途任何一次 push 都会让 tag 指向别人的
          # commit —— 结果就是固件和源码标签对不上，release 的 created_at 跟着
          # 变成那个 commit 的时间，列表排序也跟着乱。
          #
          # 这里只能用 github.sha（本仓库被 dispatch 触发时的 HEAD），不能拿
          # WRT_HASH：那个值是 Clone Code 步骤在上游源码仓库 ./wrt/ 里
          # git rev-parse HEAD 的结果（固件版本号里的 r0-<hash> 就是它），
          # 在本仓库不存在，GitHub 会直接 422 invalid target_commitish。
          target_commitish: ${{ github.sha }}
          prerelease: ${{inputs.WRT_TEST}}
          # 用 * 而不是 *.*：SHA256SUMS 这类没有扩展名的文件也要一起发布。
          # 只发固件。=m 的包（OpenClash、subgen）只编译不发布，不进 release。
          files: ./wrt/upload/*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            上游提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            主机名：${{env.WRT_NAME}}
            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}
            ${{ env.WRT_LOGIN_NOTE }}

            WIFI名称：alexwrt-jdcloud-2.4g / alexwrt-jdcloud-5.2g / alexwrt-jdcloud-5.8g
            WIFI密码：12345678

            出厂无线预设（国家码 US，仅对全新刷机生效；升级时保留配置则不覆盖已有设置）：
            - 2.4G　信道 5　　HE40
            - 5.2G　信道 36　 HE160（PCIe 4×4，首次启动需等 60 秒 CAC）
            - 5.8G　信道 161  HE80 （SoC 内置 2×2）

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
