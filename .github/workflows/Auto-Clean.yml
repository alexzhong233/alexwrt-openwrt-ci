name: Auto-Clean

on:
  # 每天北京时间 05:21（比 06:00 的定时编译早 39 分钟）清理一次。
  # 保留最近 3 个 Release（含挂在上面的固件）和最近 30 天的构建记录，
  # 这样即使某天编译失败，手上仍然有可回滚的固件。
  schedule:
    - cron: 21 21 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 保留最近 3 个 Release（连同固件文件）。
          releases_keep_latest: 3
          # 被删掉的 Release 对应的 tag 一起删，避免 tag 越积越多。
          delete_tags: true
          delete_workflows: true
          # 保留最近 30 天的构建记录。
          workflows_keep_day: 30
