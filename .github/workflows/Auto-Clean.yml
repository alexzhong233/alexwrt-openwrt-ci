name: Auto-Clean

on:
  # 每天北京时间 05:21（比 06:17 的定时编译早）清理一次。
  #
  # 保留规则按「tag 前缀」分组，而不是全局留 N 个：
  #   IPQ60XX-OWRT-WIFI-YES-alexzhong233-owrt-*         保持最近 3 个
  #   IPQ60XX-LIBWRT-WIFI-YES-alexzhong233-25.12-nss-*  保持最近 3 个
  # 之前用 ophub/delete-releases-workflows 的 releases_keep_latest: 3 是全局
  # 计数，两条线抢同一个名额 —— LIBWRT 连发三次，OWRT 的固件就一个不剩了。
  # TEST 的 pre-release 单独计数，且同样按线分组，连续点几次 TEST 不会挤掉
  # 能刷机的正式固件。
  schedule:
    - cron: 21 21 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases (grouped by Config)
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GH_REPO: ${{github.repository}}
          KEEP: 3
        run: |
          set -euo pipefail

          # tag 形如 <Config>-<owner>-<branch>-YY.MM.DD-HH.MM.SS，
          # 去掉末尾的日期时间就得到「这条线」的标识；再叠上 pre/正式
          # 两个前缀，保证两类各成一组，互不占名额。
          #
          # 不能按 createdAt 排序：WRT-CORE.yml 固定了 target_commitish=${{ github.sha }}，
          # 同一提交下多天自动编译的 release 会共享同一个 createdAt（提交时间），
          # sort_by(.createdAt) 保留原始列表顺序后再 | reverse 会把新→旧彻底颠倒，
          # 导致删掉最新的 release。publishedAt 才是实际发布时间，再拼 .tagName
          # 末尾的 YY.MM.DD-HH.MM.SS 作为同秒兜底排序键。
          gh release list --repo "$GH_REPO" --limit 200 \
              --json tagName,createdAt,publishedAt,isPrerelease \
              --jq '
                [ .[] | . + {group:
                    ((if .isPrerelease then "pre:" else "rel:" end)
                     + (.tagName | sub("-[0-9][0-9]\\.[0-9][0-9]\\.[0-9][0-9]-[0-9][0-9]\\.[0-9][0-9]\\.[0-9][0-9]$"; "")))
                } ]
                | group_by(.group)
                | map(sort_by([(.publishedAt // .createdAt), .tagName]) | reverse | .['"$KEEP"':])
                | flatten
                | .[].tagName' |
            while read -r TAG; do
              [ -n "$TAG" ] || continue
              echo "deleting release: $TAG"
              # --cleanup-tag 一并删掉远端 tag，避免 tag 越积越多。
              gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag ||
                echo "warning: failed to delete release $TAG"
            done

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GH_REPO: ${{github.repository}}
          KEEP_DAYS: 30
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "removing runs older than $CUTOFF"

          # gh 的 --jq 只收一个裸 jq 表达式，不认 jq 自己的 --arg。
          # 写成 `--jq --arg c "$CUTOFF" '...'` 时，pflag 会把 --arg 当成
          # --jq 的值，剩下三个 token 变成多余的位置参数，gh 立刻退出 1
          # —— 这一步自加进来起就没成功过（日志里 2 秒内失败就是这个）。
          # 现在 gh 只负责吐 JSON，过滤交给真正的 jq。
          gh run list --repo "$GH_REPO" --limit 500 \
              --json databaseId,createdAt |
            jq -r --arg c "$CUTOFF" '.[] | select(.createdAt < $c) | .databaseId' |
            while read -r RUN_ID; do
              [ -n "$RUN_ID" ] || continue
              gh run delete "$RUN_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete run $RUN_ID"
            done
