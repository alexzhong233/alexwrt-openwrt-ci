name: Auto-Clean

on:
  # 已停用定时清理：原配置会删除全部 Release（releases_keep_latest: 0）
  # 和全部构建记录（workflows_keep_day: 0），一旦当天编译失败就没有任何
  # 可用固件可回滚。需要清理时手动运行，或把下面 schedule 取消注释并把
  # releases_keep_latest 改成 2~3（保留最近几个固件）。
  # schedule:
  #   - cron: 21 21 * * *
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 0 = 一个都不留（含历史固件）。保留最近 3 个改成 3。
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          # 0 = 删除全部构建记录。保留 30 天改成 30。
          workflows_keep_day: 0
